# Builds the Windows installer on GitHub's servers — nothing is installed on your PC.
# Run it from the repo's Actions tab ("Build Windows installer" → Run workflow),
# or push a tag like v0.2.0 to also publish a GitHub Release with the installer attached.

name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch engines (yt-dlp, deno, ffmpeg)
        shell: pwsh
        run: ./build/fetch_engines.ps1

      - name: Build app with PyInstaller
        shell: pwsh
        run: pyinstaller --noconfirm --clean build/multitool.spec

      - name: Smoke test (frozen app loads plugins, drag-and-drop and engines)
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP "mt-test"
          Copy-Item dist/MultiTool $test -Recurse -Force
          Copy-Item plugins (Join-Path $test "plugins") -Recurse -Force
          Copy-Item bin (Join-Path $test "bin") -Recurse -Force
          $p = Start-Process -FilePath (Join-Path $test "MultiTool.exe") -PassThru
          Start-Sleep -Seconds 20
          $log = Join-Path $env:APPDATA "MultiTool\logs\multitool.log"
          $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host $text
          foreach ($needle in @("Loaded plugin media_downloader", "tkdnd")) {
            if ($text -notmatch [regex]::Escape($needle)) { throw "Smoke test failed: '$needle' not in log" }
          }
          if ($text -match "Startup failed|failed to load") { throw "Smoke test failed: errors in log" }

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path main.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" build/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MultiTool-Setup-${{ steps.ver.outputs.version }}
          path: build/Output/*.exe

      - name: Upload Media Downloader plugin (standalone file)
        uses: actions/upload-artifact@v4
        with:
          name: plugin-media_downloader
          path: plugins/media_downloader.py

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Output/*.exe
            plugins/media_downloader.py
